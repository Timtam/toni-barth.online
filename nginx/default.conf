server {
    listen       80 default_server;
    listen  [::]:80 default_server;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Sprachweiche: Nur die nackte Startseite verhandelt die Sprache, anhand
    # der vom Browser am höchsten priorisierten Sprache im
    # Accept-Language-Header. Alle tiefen Links bleiben fest verlinkbar.
    # Die statische Sprachwahlseite unter / bleibt der Fallback für Umgebungen
    # ohne nginx (z. B. astro dev / astro preview).
    location = / {
        add_header Vary Accept-Language;
        if ($http_accept_language ~* ^de) {
            return 302 /de/;
        }
        return 302 /en/;
    }

    # Alte Nikola-URLs (Englisch lag frueher ohne Praefix): Seiten, die es in
    # beiden Sprachen gibt, verhandeln die Sprache wie / -- deshalb 302 mit
    # Vary statt 301, das Ziel haengt vom Browser ab.
    location ~ ^/(teaching|gear|contact|support|privacy-policy)(/|$) {
        add_header Vary Accept-Language;
        if ($http_accept_language ~* ^de) {
            return 302 /de$request_uri;
        }
        return 302 /en$request_uri;
    }

    # Nur-englische Seiten gehen fest nach /en/ (music und resume in die
    # obere Gruppe verschieben, sobald es sie auf Deutsch gibt).
    location ~ ^/(music|resume)(/|$) {
        return 301 /en$request_uri;
    }

    # assets, media
    location ~* \.(?:css(\.map)?|js(\.map)?|jpe?g|png|gif|ico|cur|heic|webp|tiff?|mp3|m4a|aac|ogg|midi?|wav|mp4|mov|webm|mpe?g|avi|ogv|flv|wmv)$ {
            expires 30d;
            access_log off;
    }

    # svg, fonts
    location ~* \.(?:svgz?|ttf|ttc|otf|eot|woff|woff2)$ {
            add_header Access-Control-Allow-Origin "*";
            expires 30d;
            access_log off;
    }

    # compression settings
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
    gzip_buffers 16 8k;
}
