server {
    listen       80 default_server;
    listen  [::]:80 default_server;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Language switch: only the bare start page negotiates the language,
    # based on the browser's highest-priority language in the Accept-Language
    # header. All deep links stay firmly linkable. The static language
    # chooser page at / remains the fallback for environments without nginx
    # (e.g. astro dev / astro preview).
    location = / {
        add_header Vary Accept-Language;
        if ($http_accept_language ~* ^de) {
            return 302 /de/;
        }
        return 302 /en/;
    }

    # Old Nikola URLs (English used to live without a prefix): pages that
    # exist in both languages negotiate the language just like / -- hence
    # 302 with Vary instead of 301, the target depends on the browser.
    location ~ ^/(teaching|gear|contact|support|privacy-policy)(/|$) {
        add_header Vary Accept-Language;
        if ($http_accept_language ~* ^de) {
            return 302 /de$request_uri;
        }
        return 302 /en$request_uri;
    }

    # English-only pages redirect straight to /en/ (move music and resume
    # into the group above once German versions exist).
    location ~ ^/(music|resume)(/|$) {
        return 301 /en$request_uri;
    }

    # assets, media
    location ~* \.(?:css(\.map)?|js(\.map)?|jpe?g|png|gif|ico|cur|heic|webp|tiff?|mp3|m4a|aac|ogg|midi?|wav|mp4|mov|webm|mpe?g|avi|ogv|flv|wmv)$ {
            expires 30d;
            access_log off;
    }

    # svg, fonts
    location ~* \.(?:svgz?|ttf|ttc|otf|eot|woff|woff2)$ {
            add_header Access-Control-Allow-Origin "*";
            expires 30d;
            access_log off;
    }

    # compression settings
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
    gzip_buffers 16 8k;
}
