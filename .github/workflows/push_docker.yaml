on:
  push:
    branches: master
  schedule:
    # Jaehrlich am 2. Januar neu bauen, damit die zur Bauzeit berechnete
    # Copyright-Jahresspanne im Footer aktuell bleibt.
    - cron: "17 3 2 1 *"
  workflow_dispatch:

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      -
        # Typst gepinnt auf die lokal getestete Version: der HTML-Export ist
        # offiziell experimentell, deshalb keine ungeprüften Sprünge.
        name: Install Typst 0.15.1
        run: |
          curl -fsSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz | tar -xJ
          echo "$PWD/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      -
        # Baut aus cv/en.json (und cv/de.json, sobald vorhanden):
        # PDF/UA-1+A-2a nach site/public/, Resume-HTML nach site/src/generated/
        name: Build CV (Typst, PDF/UA-1 + HTML)
        run: bash cv-typst/build.sh
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: "Log in to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: tonironaldbarth/toni-barth.online:latest
